<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLASSIFIED SYSTEM</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login-screen">
  <div class="window login-box">
    <div class="titlebar">SYSTEM ACCESS</div>

    <div class="content">
      <p>ENTER PASSWORD</p>
      <input id="password" type="password" placeholder="password">
      <button onclick="login()">ENTER</button>
      <p id="error"></p>
    </div>
  </div>
</div>

<!-- DESKTOP -->
<div id="desktop" class="hidden">

  <!-- ICONS -->
  <div class="icon" style="top:60px;left:40px;" ondblclick="openWindow('notes')">📄 notes.txt</div>
  <div class="icon" style="top:140px;left:40px;" ondblclick="openWindow('audio')">📁 audio</div>
  <div class="icon" style="top:220px;left:40px;" ondblclick="openWindow('video')">📁 videos</div>
  <div class="icon" style="top:300px;left:40px;" ondblclick="openWindow('images')">📁 images</div>

  <!-- NOTES -->
  <div id="notes" class="window popup">
    <div class="titlebar">notes.txt</div>
    <div class="content">trap villian exclusive</div>
    <button onclick="closeWindow('notes')">CLOSE</button>
  </div>

  <!-- AUDIO -->
  <div id="audio" class="window popup">
    <div class="titlebar">audio</div>
    <div class="content">
      <div class="file">track01.mp3</div>
      <div class="file">track02.mp3</div>
      <div class="file">unreleased.mp3</div>
    </div>
    <button onclick="closeWindow('audio')">CLOSE</button>
  </div>

  <!-- VIDEO -->
  <div id="video" class="window popup">
    <div class="titlebar">videos</div>
    <div class="content">
      <div class="file">clip01.mp4</div>
    </div>
    <button onclick="closeWindow('video')">CLOSE</button>
  </div>

  <!-- IMAGES -->
  <div id="images" class="window popup">
    <div class="titlebar">images</div>
    <div class="content">
      <div class="file">photo01.jpg</div>
      <div class="file">photo02.jpg</div>
    </div>
    <button onclick="closeWindow('images')">CLOSE</button>
  </div>

  <!-- TASKBAR -->
  <div class="taskbar">
    <div class="start">START</div>
    <div class="title">CLASSIFIED SYSTEM</div>
    <div class="clock" id="clock">00:00</div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
