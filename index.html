<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CLASSIFIED OS</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <input id="password" type="password" placeholder="password">
  <button onclick="login()">ENTER</button>
  <p id="error"></p>
</div>

<!-- DESKTOP -->
<div id="desktop" class="hidden">

  <div id="taskbar">
    <span>CLASSIFIED OS</span>
    <input id="search" oninput="search()" placeholder="search">
    <span id="clock"></span>
  </div>

  <div id="icons">

    <div onclick="openWin('images')">🖼 imágenes</div>
    <div onclick="openWin('video')">📁 videos</div>
    <div onclick="openWin('notes')">📄 texto</div>
    <div onclick="openWin('unknown')">📁 unknown</div>
    <div onclick="openWin('snake')">🐍 snake</div>
    <div onclick="openWin('recycle')">🗑 papelera</div>
    <div onclick="openWin('player')">🎵 reproductor</div>

  </div>

  <!-- WINDOWS -->
  <div id="images" class="win hidden"><div class="bar" onmousedown="drag(this)">imágenes <button onclick="closeWin('images')">X</button></div><div class="content"></div></div>

  <div id="video" class="win hidden"><div class="bar" onmousedown="drag(this)">videos <button onclick="closeWin('video')">X</button></div><div class="content"></div></div>

  <div id="notes" class="win hidden"><div class="bar" onmousedown="drag(this)">texto <button onclick="closeWin('notes')">X</button></div><div class="content"><textarea></textarea></div></div>

  <div id="unknown" class="win hidden"><div class="bar" onmousedown="drag(this)">unknown <button onclick="closeWin('unknown')">X</button></div><div class="content"></div></div>

  <div id="recycle" class="win hidden"><div class="bar" onmousedown="drag(this)">papelera <button onclick="closeWin('recycle')">X</button></div><div class="content"></div></div>

  <div id="player" class="win hidden">
    <div class="bar" onmousedown="drag(this)">reproductor <button onclick="closeWin('player')">X</button></div>
    <div class="content">
      <ul id="playlist"></ul>
      <button onclick="play()">play</button>
      <button onclick="pause()">pause</button>
      <button onclick="next()">next</button>
      <input type="range" oninput="seek(this.value)">
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
