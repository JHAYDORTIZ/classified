<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CLASSIFIED SYSTEM</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN -->
<div id="login" class="window center">
  <div class="titlebar">SYSTEM ACCESS</div>

  <div class="content">
    <p>ENTER PASSWORD</p>
    <input id="password" type="password" placeholder="password">
    <button onclick="login()">ENTER</button>
    <p id="error" class="error"></p>
  </div>
</div>

<!-- DESKTOP -->
<div id="desktop" class="hidden">

  <div class="taskbar">CLASSIFIED SYSTEM</div>

  <div class="desktop">

    <div class="icon" onclick="openWindow('txtWindow')">📄 notes.txt</div>
    <div class="icon" onclick="openWindow('musicWindow')">📁 audio</div>
    <div class="icon" onclick="openWindow('videoWindow')">📁 videos</div>
    <div class="icon" onclick="openWindow('photoWindow')">📁 photos</div>

  </div>

  <!-- TXT -->
  <div id="txtWindow" class="window hidden draggable">
    <div class="titlebar">notes.txt</div>
    <div class="content">
      <textarea id="notes">trap villian exclusive</textarea>
      <button onclick="closeWindow('txtWindow')">CLOSE</button>
    </div>
  </div>

  <!-- MUSIC -->
  <div id="musicWindow" class="window hidden draggable">
    <div class="titlebar">audio archive</div>
    <div class="content">
      <p>no files yet</p>
      <button onclick="closeWindow('musicWindow')">CLOSE</button>
    </div>
  </div>

  <!-- VIDEO -->
  <div id="videoWindow" class="window hidden draggable">
    <div class="titlebar">video archive</div>
    <div class="content">
      <p>no files yet</p>
      <button onclick="closeWindow('videoWindow')">CLOSE</button>
    </div>
  </div>

  <!-- PHOTO -->
  <div id="photoWindow" class="window hidden draggable">
    <div class="titlebar">photo archive</div>
    <div class="content">
      <p>no files yet</p>
      <button onclick="closeWindow('photoWindow')">CLOSE</button>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
