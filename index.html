<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVE OS</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN (SIEMPRE VISIBLE AL INICIO) -->
<div id="login" class="login">

  <h1>ARCHIVE OS</h1>

  <input id="password" type="password" placeholder="access key">
  <button onclick="login()">ENTER</button>

  <p id="error"></p>

</div>

<!-- DESKTOP (OCULTO) -->
<div id="desktop" class="hidden">

  <h2>DESKTOP ACTIVE</h2>

  <div onclick="openWindow('notes')">notes.txt</div>

  <div id="notes" class="window hidden">
    <p>trap villian exclusive</p>
    <button onclick="closeWindow('notes')">close</button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
