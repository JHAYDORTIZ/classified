<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CLASSIFIED OS</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login">
  <div class="login-box">
    <h3>SYSTEM ACCESS</h3>

    <input id="password" type="password" placeholder="password">
    <button id="loginBtn">ENTER</button>

    <p id="error"></p>
  </div>
</div>

<!-- DESKTOP -->
<div id="desktop" class="hidden">

  <!-- TASKBAR -->
  <div class="taskbar">
    <span>CLASSIFIED OS</span>

    <input id="search" placeholder="Search..." oninput="searchFiles()">

    <span id="clock"></span>
  </div>

  <!-- ICONOS -->
  <div id="desktopArea">

    <div class="icon" onclick="openWindow('recycle')">🗑️<span>Papelera de reciclaje</span></div>
    <div class="icon" onclick="openWindow('unknown')">📁<span>unknown</span></div>
    <div class="icon" onclick="openWindow('videos')">📁<span>videos</span></div>
    <div class="icon" onclick="openWindow('images')">🖼️<span>imágenes</span></div>
    <div class="icon" onclick="openPlayer()">🎵<span>reproductor</span></div>
    <div class="icon" onclick="openWindow('notes')">📄<span>texto</span></div>
    <div class="icon" onclick="openWindow('snake')">🐍<span>snake</span></div>
    

  </div>

  <!-- WINDOWS -->

  <div id="images" class="window hidden">
    <div class="titlebar">imágenes <div class="close-btn" onclick="closeWindow('images')">✖</div></div>
    <div class="content">No files</div>
  </div>

  <div id="videos" class="window hidden">
    <div class="titlebar">videos <div class="close-btn" onclick="closeWindow('videos')">✖</div></div>
    <div class="content">No files</div>
  </div>

  <div id="notes" class="window hidden">
    <div class="titlebar">texto <div class="close-btn" onclick="closeWindow('notes')">✖</div></div>
    <div class="content">
      <textarea>trap villian exclusive</textarea>
    </div>
  </div>

  <div id="unknown" class="window hidden">
    <div class="titlebar">unknown <div class="close-btn" onclick="closeWindow('unknown')">✖</div></div>
    <div class="content">hidden files</div>
  </div>

  <div id="recycle" class="window hidden">
    <div class="titlebar">Papelera de reciclaje <div class="close-btn" onclick="closeWindow('recycle')">✖</div></div>
    <div class="content">empty</div>
  </div>

  <div id="snake" class="window hidden">
  <div class="titlebar">snake.exe <div class="close-btn" onclick="closeWindow('snake')">✖</div></div>

  <div class="content">
    
    <canvas
      id="game"
      width="300"
      height="300"
      style="background:black;border:1px solid #444;"
    ></canvas>

    <button onclick="startSnake()">START</button>

    <!-- 🔥 CONTROLES MÓVIL -->
    <div style="margin-top:10px; display:grid; grid-template-columns:repeat(3,60px); gap:5px; justify-content:center;">

      <div></div>
      <button onclick="setDir(0,-1)">⬆️</button>
      <div></div>

      <button onclick="setDir(-1,0)">⬅️</button>
      <div></div>
      <button onclick="setDir(1,0)">➡️</button>

      <div></div>
      <button onclick="setDir(0,1)">⬇️</button>
      <div></div>

    </div>

  </div>
</div>

  <!-- REPRODUCTOR -->
  <div id="player" class="window hidden">
    <div class="titlebar">reproductor <div class="close-btn" onclick="closeWindow('player')">✖</div></div>

    <div class="content">

      <div style="display:flex; gap:10px;">

        <div style="width:40%;">
          <ul id="playlist"></ul>
        </div>

        <div style="width:60%;">
          <button onclick="play()">▶</button>
          <button onclick="pause()">⏸</button>
          <button onclick="seek(-10)">-10s</button>
          <button onclick="seek(10)">+10s</button>
          <button onclick="next()">⏭</button>

          <br><br>

          <input type="range" id="seekBar" min="0" max="100"
                 oninput="setTime(this.value)">
        </div>

      </div>

    </div>
  </div>

  <!-- SEARCH -->
  <div id="searchWindow" class="window hidden">
    <div class="titlebar">search <div class="close-btn" onclick="closeWindow('searchWindow')">✖</div></div>
    <div id="searchResults" class="content"></div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
