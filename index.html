<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLASSIFIED SYSTEM</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login-screen">
  <div class="window">
    <div class="titlebar">SYSTEM ACCESS</div>

    <div class="content">
      <p>ENTER PASSWORD</p>

      <input id="password" type="password" placeholder="password">

      <button onclick="login()">ENTER</button>

      <p id="error" class="error"></p>
    </div>
  </div>
</div>

<!-- DESKTOP -->
<div id="desktop" class="hidden">

  <div class="desktop">

    <div class="icon" ondblclick="openWindow('txtWindow')">📄 notes.txt</div>
    <div class="icon" ondblclick="openWindow('musicWindow')">📁 AUDIO</div>
    <div class="icon" ondblclick="openWindow('videoWindow')">📁 VIDEOS</div>
    <div class="icon" ondblclick="openWindow('photoWindow')">📁 PHOTOS</div>

  </div>

  <div class="taskbar">CLASSIFIED SYSTEM</div>

  <!-- NOTES -->
  <div id="txtWindow" class="window popup">
    <div class="titlebar">notes.txt</div>
    <div class="content">
      <div class="file">trap villian exclusive</div>
      <button onclick="closeWindow('txtWindow')">CLOSE</button>
    </div>
  </div>

  <!-- AUDIO -->
  <div id="musicWindow" class="window popup">
    <div class="titlebar">audio archive</div>
    <div class="content">
      <div class="file">track01.mp3</div>
      <div class="file">track02.mp3</div>
      <div class="file">unreleased.mp3</div>
      <button onclick="closeWindow('musicWindow')">CLOSE</button>
    </div>
  </div>

  <!-- VIDEO -->
  <div id="videoWindow" class="window popup">
    <div class="titlebar">video archive</div>
    <div class="content">
      <div class="file">clip01.mp4</div>
      <div class="file">clip02.mp4</div>
      <button onclick="closeWindow('videoWindow')">CLOSE</button>
    </div>
  </div>

  <!-- PHOTO -->
  <div id="photoWindow" class="window popup">
    <div class="titlebar">photo archive</div>
    <div class="content">
      <div class="file">photo01.jpg</div>
      <div class="file">photo02.jpg</div>
      <button onclick="closeWindow('photoWindow')">CLOSE</button>
    </div>
  </div>

</div>

<script src="app.js"></script>

</body>
</html>
