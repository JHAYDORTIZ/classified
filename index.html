<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLASSIFIED SYSTEM</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login-screen">

  <div class="window login-box">
    <div class="titlebar">SYSTEM ACCESS</div>

    <div class="content">
      <input id="password" type="password" placeholder="password">
      <button onclick="login()">ENTER</button>
      <p id="error"></p>
    </div>

  </div>

</div>

<!-- DESKTOP -->
<div id="desktop" class="hidden">

  <!-- ICONS -->
  <div class="icon" style="top:50px;left:40px;" ondblclick="openWindow('txtWindow')">📄 notes.txt</div>
  <div class="icon" style="top:130px;left:40px;" ondblclick="openWindow('musicWindow')">📁 audio</div>
  <div class="icon" style="top:210px;left:40px;" ondblclick="openWindow('videoWindow')">📁 videos</div>
  <div class="icon" style="top:290px;left:40px;" ondblclick="openWindow('photoWindow')">📁 images</div>

  <!-- TASKBAR -->
  <div class="taskbar">

    <div class="start">START</div>

    <div class="task-title">CLASSIFIED SYSTEM</div>

    <div class="clock" id="clock">00:00</div>

  </div>

  <!-- WINDOWS -->

  <div id="txtWindow" class="window popup">
    <div class="titlebar">notes.txt</div>
    <div class="content">trap villian exclusive</div>
    <button onclick="closeWindow('txtWindow')">CLOSE</button>
  </div>

  <div id="musicWindow" class="window popup">
    <div class="titlebar">audio</div>
    <div class="content">
      <div>track1.mp3</div>
      <div>track2.mp3</div>
    </div>
    <button onclick="closeWindow('musicWindow')">CLOSE</button>
  </div>

  <div id="videoWindow" class="window popup">
    <div class="titlebar">videos</div>
    <div class="content">
      <div>clip1.mp4</div>
    </div>
    <button onclick="closeWindow('videoWindow')">CLOSE</button>
  </div>

  <div id="photoWindow" class="window popup">
    <div class="titlebar">images</div>
    <div class="content">
      <img src="media/photo1.jpg" width="120">
      <img src="media/photo2.jpg" width="120">
    </div>
    <button onclick="closeWindow('photoWindow')">CLOSE</button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
