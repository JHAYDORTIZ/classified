<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CLASSIFIED ARCHIVE</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN WINDOW -->
<div id="loginWindow" class="window">
  <div class="titlebar">ACCESS TERMINAL</div>

  <div class="content">
    <p>ENTER PASSWORD</p>
    <input id="password" type="password" placeholder="password">
    <button onclick="checkPassword()">ENTER</button>
    <p id="error" class="error"></p>
  </div>
</div>

<!-- DESKTOP -->
<div id="desktop" class="hidden">

  <div class="desktop">

    <!-- TXT FILE -->
    <div class="icon" onclick="openTxt()">
      📄 notes.txt
    </div>

    <!-- PHOTO FOLDER -->
    <div class="icon">
      📁 photos
    </div>

    <!-- VIDEO FOLDER -->
    <div class="icon">
      📁 videos
    </div>

    <!-- AUDIO FOLDER -->
    <div class="icon">
      📁 audio
    </div>

  </div>

  <!-- TXT WINDOW -->
  <div id="txtWindow" class="window hidden">
    <div class="titlebar">notes.txt</div>
    <div class="content">
      <textarea id="txtContent">trap villian exclusive</textarea>
      <button onclick="closeTxt()">CLOSE</button>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
