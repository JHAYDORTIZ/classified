<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CLASSIFIED SYSTEM</title>
<link rel="stylesheet" href="style.css">

<style>
body {
  cursor: url("assets/cursor.cur"), default;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login">
  <div class="login-box">
    <h3>SYSTEM ACCESS</h3>
    <input id="password" type="password" placeholder="password">
    <button onclick="login()">ENTER</button>
    <p id="error"></p>
  </div>
</div>

<!-- DESKTOP -->
<div id="desktop" class="hidden">

  <div class="taskbar">
    <span>CLASSIFIED OS</span>

    <input id="search" placeholder="Search..." oninput="searchFiles()">

    <span id="clock"></span>
  </div>

  <div class="desktop">

    <div class="icon" onclick="openWindow('notes')">📄 notes.txt</div>
    <div class="icon" onclick="openWindow('audio')">📁 audio</div>
    <div class="icon" onclick="openWindow('video')">📁 videos</div>
    <div class="icon" onclick="openWindow('images')">📁 images</div>
    <div class="icon" onclick="openWindow('snake')">🐍 snake.exe</div>

  </div>

  <!-- NOTES -->
  <div id="notes" class="window hidden">
    <div class="titlebar">notes.txt</div>
    <div class="content">
      <textarea>trap villian exclusive</textarea>
      <button onclick="closeWindow('notes')">CLOSE</button>
    </div>
  </div>

  <!-- AUDIO -->
  <div id="audio" class="window hidden">
    <div class="titlebar">audio</div>
    <div class="content">
      <p>no files</p>
      <button onclick="closeWindow('audio')">CLOSE</button>
    </div>
  </div>

  <!-- VIDEO -->
  <div id="video" class="window hidden">
    <div class="titlebar">videos</div>
    <div class="content">
      <p>no files</p>
      <button onclick="closeWindow('video')">CLOSE</button>
    </div>
  </div>

  <!-- IMAGES -->
  <div id="images" class="window hidden">
    <div class="titlebar">images</div>
    <div class="content">
      <p>no files</p>
      <button onclick="closeWindow('images')">CLOSE</button>
    </div>
  </div>

  <!-- SNAKE -->
  <div id="snake" class="window hidden">
    <div class="titlebar">snake.exe</div>
    <div class="content">
      <canvas id="game" width="300" height="300"></canvas>
      <button onclick="startSnake()">START</button>
      <button onclick="closeWindow('snake')">CLOSE</button>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
