<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ARCHIVE SYSTEM</title>
<link rel="stylesheet" href="style.css">

<!-- Cursor -->
<style>
body {
  cursor: url("assets/cursor.cur"), default;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="window center">
  <div class="titlebar">SYSTEM ACCESS</div>

  <div class="content">
    <p>ENTER PASSWORD</p>
    <input id="password" type="password" placeholder="password">
    <button onclick="login()">ENTER</button>
    <p id="error" class="error"></p>
  </div>
</div>

<!-- DESKTOP -->
<div id="desktop" class="hidden">

  <div class="taskbar">
    ARCHIVE SYSTEM
    <span id="clock" style="float:right;"></span>
  </div>

  <div class="desktop">

    <div class="icon" onclick="openWindow('txtWindow')">📄 notes.txt</div>
    <div class="icon" onclick="openWindow('musicWindow')">📁 audio</div>
    <div class="icon" onclick="openWindow('videoWindow')">📁 videos</div>
    <div class="icon" onclick="openWindow('photoWindow')">📁 images</div>
    <div class="icon" onclick="openWindow('snakeWindow')">🐍 snake.exe</div>

  </div>

  <!-- NOTES -->
  <div id="txtWindow" class="window hidden">
    <div class="titlebar">notes.txt</div>
    <div class="content">
      <textarea>trap villian exclusive</textarea>
      <button onclick="closeWindow('txtWindow')">CLOSE</button>
    </div>
  </div>

  <!-- AUDIO -->
  <div id="musicWindow" class="window hidden">
    <div class="titlebar">audio</div>
    <div class="content">
      <p>no files yet</p>
      <button onclick="closeWindow('musicWindow')">CLOSE</button>
    </div>
  </div>

  <!-- VIDEO -->
  <div id="videoWindow" class="window hidden">
    <div class="titlebar">videos</div>
    <div class="content">
      <p>no files yet</p>
      <button onclick="closeWindow('videoWindow')">CLOSE</button>
    </div>
  </div>

  <!-- IMAGES -->
  <div id="photoWindow" class="window hidden">
    <div class="titlebar">images</div>
    <div class="content">
      <p>no files yet</p>
      <button onclick="closeWindow('photoWindow')">CLOSE</button>
    </div>
  </div>

  <!-- SNAKE -->
  <div id="snakeWindow" class="window hidden">
    <div class="titlebar">snake.exe</div>
    <div class="content">
      <canvas id="snakeCanvas" width="300" height="300"></canvas>
      <br>
      <button onclick="startSnake()">START</button>
      <button onclick="closeWindow('snakeWindow')">CLOSE</button>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
